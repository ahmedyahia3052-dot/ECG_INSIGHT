name: Enterprise QA Automation

on:
  pull_request:
  push:

concurrency:
  group: enterprise-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  unit-tests:
    runs-on: ubuntu-latest
    needs: static-gates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run qa:unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-summary
          path: test-results/qa-artifacts/unit-test-summary.json

  integration:
    runs-on: ubuntu-latest
    needs: static-gates
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecg_insight_qa
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d ecg_insight_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecg_insight_qa
      JWT_REFRESH_SECRET: qa-refresh-secret-000000000000000000000000000000
      JWT_SECRET: qa-access-secret-00000000000000000000000000000000
      NODE_ENV: test
      RATE_LIMIT_MAX: 900
      RATE_LIMIT_WINDOW_MS: 900000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm run test
      - run: node scripts/qa/audit-integration-coverage.mjs

  playwright:
    runs-on: ubuntu-latest
    needs: [static-gates, integration]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ecg_insight_qa
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d ecg_insight_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      CLIENT_ORIGIN: http://127.0.0.1:8081
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ecg_insight_qa
      EXPO_NO_DOCTOR: "1"
      EXPO_OFFLINE: "1"
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3002/api
      JWT_REFRESH_SECRET: qa-refresh-secret-000000000000000000000000000000
      JWT_SECRET: qa-access-secret-00000000000000000000000000000000
      NODE_ENV: test
      PLAYWRIGHT_API_URL: http://127.0.0.1:3002/api
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:8081
      PORT: 3002
      PLAYWRIGHT_FRESH_SESSION: "1"
      QA_INCLUDE_SPRINT38: "0"
      RATE_LIMIT_MAX: 900
      RATE_LIMIT_WINDOW_MS: 900000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: node scripts/qa/audit-playwright-coverage.mjs
      - run: node scripts/run-playwright-sequential.mjs --suite=smoke
      - run: node scripts/run-playwright-sequential.mjs --suite=enterprise
      - run: npx playwright test tests/e2e/enterprise-workflow-matrix.spec.ts --grep-invert "@sprint38" --project=chromium-desktop
      - run: node scripts/run-playwright-sequential.mjs --suite=accessibility
      - run: node scripts/run-playwright-sequential.mjs --suite=visual
      - run: node scripts/run-playwright-sequential.mjs --suite=mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: playwright-report
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-artifacts
          path: test-results
          retention-days: 14

  quality-dashboard:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration, playwright]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: unit-test-summary
          path: test-results/qa-artifacts
        continue-on-error: true
      - run: node scripts/qa/audit-integration-coverage.mjs
      - run: node scripts/qa/audit-playwright-coverage.mjs
      - run: npm run qa:dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: qa-dashboard
          path: test-results/qa-dashboard
          retention-days: 30
